<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' cmux-waveform: 'wasm-unsafe-eval'; worker-src 'self' cmux-waveform:; connect-src 'self' cmux-waveform:; style-src 'self' cmux-waveform: 'unsafe-inline'; font-src 'self' cmux-waveform:; img-src 'self' cmux-waveform: data:; frame-src 'self' cmux-waveform:; base-uri 'none'; form-action 'none'">
  <title>Waveform</title>
  <link rel="stylesheet" href="vscode-theme.css">
  <style>
    html, body { height: 100%; overflow: hidden; }
    body { display: flex; font-family: var(--vscode-font-family); font-size: 12px; user-select: none; -webkit-user-select: none; }
    #netlist { width: 220px; min-width: 120px; max-width: 60%; flex: none; display: flex; flex-direction: column;
      border-right: 1px solid var(--vscode-widget-border); resize: horizontal; overflow: hidden; }
    #netlist-title { flex: none; margin: 0; padding: 6px 10px 4px; font-weight: 600; text-transform: uppercase;
      font-size: 11px; color: var(--vscode-descriptionForeground); }
    #tree { flex: 1; overflow: auto; padding-bottom: 8px; }
    #tree .row { padding: 1px 6px; cursor: default; white-space: nowrap; line-height: 20px; }
    #tree .row:hover { background: var(--vscode-list-hoverBackground); }
    #tree .scope::before { content: '\25B8\00a0\00a0'; }
    #tree .scope.open::before { content: '\25BE\00a0\00a0'; }
    #tree .var { color: var(--vscode-symbolIcon-variableForeground); cursor: pointer; }
    #tree .var .range { color: var(--vscode-descriptionForeground); }
    #main { flex: 1; position: relative; min-width: 0; }
    #viewer { position: absolute; inset: 0; width: 100%; height: 100%; border: 0; }
    #message { position: absolute; inset: 0; display: none; align-items: center; justify-content: center;
      flex-direction: column; gap: 6px; padding: 24px; text-align: center; color: var(--vscode-descriptionForeground); }
    #message.visible { display: flex; }
    #message .title { color: var(--vscode-foreground); font-size: 13px; font-weight: 600; }
    #message .detail { font-family: var(--vscode-editor-font-family); white-space: pre-wrap; user-select: text; -webkit-user-select: text; }
  </style>
</head>
<body>
  <div id="netlist"><h4 id="netlist-title"></h4><div id="tree"></div></div>
  <div id="main">
    <iframe id="viewer" title=""></iframe>
    <div id="message"><div class="title"></div><div class="detail"></div></div>
  </div>
  <script src="host.js"></script>
</body>
</html>
