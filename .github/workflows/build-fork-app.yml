name: Build fork app

# Builds an ad-hoc-signed cmux DEV app on a GitHub-hosted macOS runner and
# uploads it as an artifact. Manual or on push to sv-editor only.
on:
  workflow_dispatch:
  push:
    branches: [sv-editor]

concurrency:
  group: build-fork-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-26
    timeout-minutes: 120
    env:
      CMUX_DEV_BACKEND_MODE: local
      CMUX_ALLOW_UNSIGNED_DEV_APP: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Select Xcode
        run: ./scripts/select-ci-xcode.sh

      - name: Metal toolchain
        run: xcrun metal --version || xcodebuild -downloadComponent MetalToolchain

      - name: Install zig
        run: ./scripts/install-zig-ci.sh

      - name: Install Rust
        run: ./scripts/install-rust-ci.sh

      - name: Setup
        run: ./scripts/setup.sh

      # Fork commits have no published cmux-tui client, so borrow the newest
      # one published for an upstream main commit.
      - name: Find published cmux-tui client
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for sha in $(gh api 'repos/manaflow-ai/cmux/commits?sha=main&per_page=100' -q '.[].sha'); do
            url="https://files.cmux.com/cmux-tui/$sha/manifest.json"
            if curl -fsI "$url" >/dev/null 2>&1; then
              echo "CMUX_TUI_CLIENT_MANIFEST_URL=$url" >> "$GITHUB_ENV"
              echo "using $url"
              exit 0
            fi
          done
          echo "::error::no published cmux-tui client in the last 100 upstream main commits"
          exit 1

      - name: Build app
        run: ./scripts/reload.sh --tag svedit --build-only

      - name: Package app
        run: |
          app="$(find "$HOME/Library/Developer/Xcode/DerivedData" /tmp -maxdepth 6 -name 'cmux DEV svedit.app' -type d 2>/dev/null | head -1)"
          test -n "$app" || { echo "::error::built app not found"; exit 1; }
          echo "app=$app"
          ditto -c -k --keepParent "$app" "$RUNNER_TEMP/cmux-svedit.zip"

      - name: Upload app
        uses: actions/upload-artifact@v4
        with:
          name: cmux-svedit-${{ github.sha }}
          path: ${{ runner.temp }}/cmux-svedit.zip
          retention-days: 14
